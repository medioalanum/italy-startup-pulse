[project]
name = "italy-startup-pulse"
version = "0.1.0"
description = "Aggregated quarterly pipeline and dashboard for Italy's innovative startup registry"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.30",
    "psycopg[binary]>=3.2.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "jinja2>=3.1.4",
    "pandas>=2.2.0",
]

[dependency-groups]
dev = [
    "ruff>=0.6.0",
    "ty>=0.0.1",
    "pytest>=8.3.0",
    "httpx>=0.27.0",
    "pdfplumber>=0.11.10",
    "pypdf>=6.19.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 88
target-version = "py312"
[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]
ignore = ["E501"]
[tool.ruff.format]
quote-style = "double"
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
