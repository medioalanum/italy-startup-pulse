services:
  - type: web
    name: italy-startup-pulse
    runtime: python
    buildCommand: pip install uv && uv sync
    startCommand: uv run uvicorn startup_pulse.web.app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SOURCE_MODE
        value: sample
