<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Italy Startup Pulse{% endblock %}</title>
<style>
:root{color-scheme:dark;--ink:#e7edf3;--muted:#9aabba;--line:#234b6b;--accent:#38b2ac;--blue:#2aa7ee}*{box-sizing:border-box}body{margin:0;background:#071521;color:var(--ink);font:15px/1.55 Inter,ui-sans-serif,system-ui,sans-serif}a{color:#72d5d0}.shell{max-width:1180px;margin:auto;padding:0 24px}.topbar{border-bottom:1px solid var(--line);background:#081b2b}.topbar-inner{display:flex;align-items:center;justify-content:space-between;min-height:72px;gap:24px}.brand{color:var(--ink);font-weight:750;font-size:1.1rem;text-decoration:none}.brand span{color:var(--accent)}nav{display:flex;gap:18px;flex-wrap:wrap}nav a{color:var(--muted);text-decoration:none;font-size:.9rem}.sample{margin:20px 0 0;padding:10px 14px;border:1px solid #a87833;border-radius:8px;background:#352816;color:#f4c979}main{padding:52px 0 80px}.eyebrow{color:var(--accent);font-size:.75rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase}h1{max-width:760px;margin:8px 0 14px;font-size:clamp(2.4rem,6vw,4.8rem);line-height:1.02;letter-spacing:-.05em}h2{margin:8px 0 10px;font-size:1.8rem}h3{margin:0;font-size:1rem}.lede{max-width:720px;color:var(--muted);font-size:1.05rem}section{scroll-margin-top:90px;margin-top:72px}.section-head{margin-bottom:24px}.section-head p{color:var(--muted);max-width:720px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card,.panel{background:linear-gradient(145deg,#102a43,#0c2237);border:1px solid var(--line);border-radius:12px;padding:20px}.label{color:var(--muted);font-size:.7rem;letter-spacing:.13em;text-transform:uppercase}.value{margin:8px 0 2px;font-size:1.7rem;font-weight:750}.subtle,.note{color:var(--muted);font-size:.85rem}.breakdown-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:18px}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.switch{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}.switch button{border:0;background:transparent;color:var(--muted);padding:8px 12px;cursor:pointer}.switch button.active{background:var(--accent);color:#062326;font-weight:700}.bar-row{display:grid;grid-template-columns:130px 1fr 64px;align-items:center;gap:10px;margin:13px 0}.bar-label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.track{height:12px;border-radius:99px;background:#193b56;overflow:hidden}.bar{height:100%;border-radius:inherit;background:var(--blue)}.bar.leading{background:var(--accent)}.bar-value{text-align:right;font-variant-numeric:tabular-nums}table{width:100%;border-collapse:collapse}th,td{padding:11px 8px;border-bottom:1px solid #1d3a52;text-align:left}th{color:var(--muted);font-size:.75rem;letter-spacing:.08em;text-transform:uppercase}td.num{text-align:right;font-variant-numeric:tabular-nums}.hidden{display:none}.timeline{display:flex;gap:8px;margin:20px 0}.period{flex:1;padding:14px;border-top:3px solid var(--line);color:var(--muted)}.period.current{border-color:var(--accent);color:var(--ink)}footer{border-top:1px solid var(--line);padding:22px 0;color:var(--muted);font-size:.82rem}@media(max-width:800px){.cards,.breakdown-grid{grid-template-columns:1fr 1fr}.topbar-inner{align-items:flex-start;flex-direction:column;padding:16px 0}}@media(max-width:560px){.cards,.breakdown-grid{grid-template-columns:1fr}.bar-row{grid-template-columns:100px 1fr 56px;font-size:.85rem}main{padding-top:34px}}
</style></head>
<body><header class="topbar"><div class="shell topbar-inner"><a class="brand" href="/">Italy Startup <span>Pulse</span></a><nav><a href="#overview">Overview</a><a href="#breakdowns">Breakdowns</a><a href="#change">Change</a><a href="#monitoring">Monitoring</a><a href="#methodology">Methodology</a></nav></div></header><div class="shell">{% if sample %}<p class="sample"><strong>Sample data.</strong> Live registry ingestion is not yet connected.</p>{% else %}<p class="sample"><strong>Latest official snapshot.</strong> Data sourced from MIMIT quarterly reports.</p>{% endif %}</div>{% block content %}{% endblock %}</body></html>
